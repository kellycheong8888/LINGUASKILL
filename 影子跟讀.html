<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>影子跟读 · Linguaskill Business</title>
    <style>
        /* ===== 全局重置 & 暖阳主题 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fbf8f0; color: #3d3d3d; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 16px 14px 60px; display: flex; flex-direction: column; align-items: center; }
        .app-container { max-width: 860px; width: 100%; }
        .app-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #e8e0d8; }
        .app-header h1 { font-weight: 600; font-size: 1.5rem; color: #5b8c5a; letter-spacing: 0.5px; }
        .app-header h1 span { color: #d4a373; }
        .version-badge { font-size: 0.7rem; background: #e8e0d8; padding: 3px 14px; border-radius: 30px; color: #8a7a6a; cursor: default; user-select: none; }
        .version-badge:active { transform: scale(0.95); }
        .browser-warning { background: #f5ede4; color: #8a6a4a; padding: 10px 16px; border-radius: 12px; font-weight: 500; margin-bottom: 14px; display: none; align-items: center; gap: 8px; font-size: 0.9rem; border-left: 4px solid #d4a373; }
        .browser-warning.show { display: flex; }

        /* ===== 控制栏 ===== */
        .control-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; background: #ffffff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 4px 20px rgba(160,120,80,0.08); border: 1px solid #ece5dd; }
        .control-bar select { background: #f5f0eb; color: #3d3d3d; border: 1px solid #d5cdc5; padding: 5px 12px; border-radius: 30px; font-size: 0.85rem; outline: none; cursor: pointer; font-weight: 500; }
        .control-bar select:focus { border-color: #5b8c5a; box-shadow: 0 0 0 3px rgba(91,140,90,0.15); }
        #passageSelect { min-width: 130px; }
        #voiceSelect { min-width: 120px; }

        .speed-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .speed-group label { font-size: 0.8rem; color: #6a5a4a; font-weight: 600; }
        .speed-group input[type="range"] { width: 80px; accent-color: #5b8c5a; cursor: pointer; }
        .speed-group .speed-val { font-size: 0.8rem; font-weight: 700; color: #5b8c5a; min-width: 36px; text-align: center; }
        .speed-btn { background: #f5f0eb; border: 1px solid #d5cdc5; border-radius: 30px; padding: 2px 10px; font-size: 0.7rem; font-weight: 600; color: #3d3d3d; cursor: pointer; transition: 0.15s; }
        .speed-btn:hover { background: #ece5dd; }
        .speed-btn.active-speed { background: #5b8c5a; color: #fff; border-color: #5b8c5a; }

        .action-btn { background: #5b8c5a; border: none; color: #fff; font-weight: 600; padding: 5px 16px; border-radius: 40px; font-size: 0.85rem; cursor: pointer; transition: 0.25s; box-shadow: 0 4px 14px rgba(91,140,90,0.25); }
        .action-btn:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
        .action-btn:active:not(:disabled) { transform: scale(0.95); }
        .action-btn.secondary { background: #d4a373; box-shadow: 0 4px 14px rgba(212,163,115,0.3); }
        .action-btn.outline { background: transparent; color: #5b8c5a; border: 2px solid #5b8c5a; box-shadow: none; }
        .action-btn.outline:hover { background: #f0f7ef; }
        .action-btn.danger { background: #c0392b; box-shadow: 0 4px 14px rgba(192,57,43,0.3); }
        .action-btn.danger:hover { background: #a93226; }
        .action-btn.recording-pulse { animation: pulse-rec 0.8s infinite; }
        @keyframes pulse-rec { 0% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); } 100% { box-shadow: 0 0 0 12px rgba(192,57,43,0); } }

        .progress-text { font-size: 0.85rem; background: #f5f0eb; padding: 3px 14px; border-radius: 30px; border: 1px solid #d5cdc5; white-space: nowrap; font-weight: 500; color: #6a5a4a; }

        /* ===== 句子列表 ===== */
        .sentences-list { display: flex; flex-direction: column; gap: 14px; margin: 16px 0 24px; }
        .sentence-card { background: #ffffff; border-radius: 18px; padding: 14px 18px; border-left: 6px solid #d5cdc5; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(160,120,80,0.06); border: 1px solid #ece5dd; }
        .sentence-card.active-tts { border-left-color: #d4a373; box-shadow: 0 0 0 4px rgba(212,163,115,0.15), 0 4px 24px rgba(160,120,80,0.1); animation: breathe-glow-light 1.6s infinite; }
        @keyframes breathe-glow-light { 0% { box-shadow: 0 0 0 4px rgba(212,163,115,0.1), 0 2px 12px rgba(0,0,0,0.04); } 50% { box-shadow: 0 0 0 8px rgba(212,163,115,0.2), 0 4px 24px rgba(212,163,115,0.12); } 100% { box-shadow: 0 0 0 4px rgba(212,163,115,0.1), 0 2px 12px rgba(0,0,0,0.04); } }
        .sentence-card.recording { border-left-color: #c0392b; box-shadow: 0 0 0 4px rgba(192,57,43,0.12), 0 4px 20px rgba(192,57,43,0.08); animation: pulse-rec-light 0.9s infinite; }
        @keyframes pulse-rec-light { 0% { box-shadow: 0 0 0 4px rgba(192,57,43,0.1); } 50% { box-shadow: 0 0 0 10px rgba(192,57,43,0.18); } 100% { box-shadow: 0 0 0 4px rgba(192,57,43,0.1); } }
        .sentence-card.completed { border-left-color: #7aa87a; }
        .sentence-card.full-play-highlight { background: #f5f7fa; border-left-color: #4a90d9; }

        .sentence-text { font-size: 17px; line-height: 1.7; color: #3d3d3d; cursor: pointer; padding: 4px 0; border-radius: 4px; transition: 0.2s; user-select: none; }
        .sentence-text.hidden { background: #e8e0d8; color: transparent; border-radius: 6px; padding: 4px 10px; min-height: 1.7em; cursor: pointer; }
        .sentence-text.hidden::before { content: "👆 点击显示英文"; color: #8a7a6a; font-size: 14px; }

        .translation-area { margin-top: 4px; font-size: 15px; color: #6a5a4a; padding: 4px 12px; background: #f5f0eb; border-radius: 10px; cursor: pointer; transition: 0.25s; min-height: 2em; display: flex; align-items: center; user-select: none; }
        .translation-area.hidden { background: #e8e0d8; color: transparent; }
        .translation-area.hidden::before { content: "👆 点击显示翻译"; color: #8a7a6a; font-size: 14px; }
        .translation-area .zh-text { color: #3d3d3d; }
        .translation-area.hidden .zh-text { display: none; }

        .card-status { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 0.78rem; color: #8a7a6a; flex-wrap: wrap; gap: 4px; }
        .accuracy-badge { color: #5b8c5a; font-weight: 600; background: #f0f7ef; padding: 2px 14px; border-radius: 30px; font-size: 0.78rem; }

        .comparison-result { margin-top: 8px; background: #f5f0eb; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; display: none; flex-wrap: wrap; gap: 3px 5px; border-left: 4px solid #d4a373; }
        .comparison-result.show { display: flex; }
        .word-match { color: #5b8c5a; font-weight: 500; }
        .word-mismatch { color: #c0392b; background: #fdedec; padding: 0 6px; border-radius: 4px; position: relative; font-weight: 500; }
        .word-mismatch::after { content: attr(data-correct); position: absolute; bottom: -1.4em; left: 0; font-size: 0.65rem; color: #a93226; background: #fff; padding: 0 8px; border-radius: 6px; white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .word-mismatch:hover::after { display: block; }

        .manual-input-area { margin-top: 8px; display: none; gap: 6px; flex-wrap: wrap; }
        .manual-input-area.show { display: flex; }
        .manual-input-area input { flex: 1; min-width: 120px; padding: 6px 12px; border: 2px solid #d5cdc5; border-radius: 30px; font-size: 0.85rem; background: #ffffff; outline: none; transition: 0.2s; }
        .manual-input-area input:focus { border-color: #5b8c5a; box-shadow: 0 0 0 3px rgba(91,140,90,0.12); }
        .manual-input-area .mini-btn { background: #5b8c5a; color: #fff; border: none; padding: 4px 16px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .manual-input-area .mini-btn:hover { background: #4a7a49; }

        .waveform-wrapper { background: #f5f0eb; border-radius: 14px; padding: 4px 0; margin: 6px 0 2px; height: 44px; display: none; align-items: center; justify-content: center; }
        .waveform-wrapper.active { display: flex; }
        .waveform-wrapper canvas { width: 100%; height: 36px; border-radius: 10px; background: #f5f0eb; }

        .sentence-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #ece5dd; }
        .sentence-actions .mini-btn { background: #f5f0eb; border: 1px solid #d5cdc5; color: #3d3d3d; padding: 3px 12px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
        .sentence-actions .mini-btn:hover { background: #ece5dd; }
        .sentence-actions .mini-btn.active { background: #c0392b; color: #fff; border-color: #c0392b; animation: pulse-rec-light 0.9s infinite; }
        .sentence-actions .mini-btn.primary { background: #5b8c5a; color: #fff; border-color: #5b8c5a; }
        .sentence-actions .mini-btn.primary:hover { background: #4a7a49; }
        .sentence-actions .mini-btn.success { background: #7aa87a; color: #fff; border-color: #7aa87a; }
        .sentence-actions .mini-btn.success:hover { background: #6a9a6a; }
        .sentence-actions .mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== 报告 & 历史 ===== */
        .report-area { background: #ffffff; border-radius: 20px; padding: 20px; margin-top: 24px; display: none; border: 1px solid #ece5dd; box-shadow: 0 4px 24px rgba(160,120,80,0.06); }
        .report-area.show { display: block; }
        .report-area h3 { color: #5b8c5a; margin-bottom: 12px; font-weight: 600; font-size: 1.2rem; }
        .report-stats { display: flex; flex-wrap: wrap; gap: 16px 28px; background: #f5f0eb; padding: 12px 18px; border-radius: 16px; }
        .report-stats div { font-size: 0.9rem; }
        .report-stats strong { color: #5b8c5a; }
        .report-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .report-actions .action-btn { margin-left: 0; }
        .history-area { margin-top: 24px; background: #ffffff; border-radius: 16px; padding: 14px 18px; font-size: 0.85rem; border: 1px solid #ece5dd; }
        .history-area h4 { color: #8a7a6a; font-weight: 500; margin-bottom: 8px; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0ebe5; color: #4a4a4a; font-size: 0.8rem; flex-wrap: wrap; gap: 4px; }

        @media (max-width: 640px) {
            .control-bar { flex-direction: column; align-items: stretch; gap: 6px; }
            .control-bar select { width: 100%; }
            .speed-group { justify-content: center; }
            .action-btn { text-align: center; }
            .sentence-actions { gap: 4px; }
            .sentence-actions .mini-btn { font-size: 0.7rem; padding: 3px 8px; }
            .sentence-text { font-size: 15px; }
            .app-header h1 { font-size: 1.2rem; }
        }
        @media (max-width: 420px) {
            .sentence-actions .mini-btn { font-size: 0.65rem; padding: 2px 6px; }
            .sentence-card { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- 头部 -->
    <div class="app-header">
        <h1>Linguaskill · <span>Business</span></h1>
        <span class="version-badge" id="versionBadge" title="双击清空所有数据">v2.2.0</span>
    </div>
    <div class="browser-warning" id="browserWarning">⚠️ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器。</div>

    <!-- 控制栏 -->
    <div class="control-bar" id="controlBar">
        <select id="passageSelect"></select>
        <select id="voiceSelect">
            <option value="en-GB-SoniaNeural">🎤 Sonia（温柔女声）</option>
            <option value="en-GB-AdaMultilingualNeural">🎤 Ada（活泼女声）</option>
            <option value="en-GB-OllieMultilingualNeural">🎤 Ollie（温暖男声）</option>
        </select>

        <!-- 语速控制 -->
        <div class="speed-group">
            <label>🐢</label>
            <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="0.8">
            <span class="speed-val" id="speedDisplay">0.80</span>
            <label>🐇</label>
        </div>
        <div class="speed-group" style="gap:2px;">
            <button class="speed-btn" data-speed="0.5">0.5×</button>
            <button class="speed-btn" data-speed="0.7">0.7×</button>
            <button class="speed-btn active-speed" data-speed="0.8">0.8×</button>
            <button class="speed-btn" data-speed="1.0">1.0×</button>
            <button class="speed-btn" data-speed="1.2">1.2×</button>
            <button class="speed-btn" data-speed="1.5">1.5×</button>
        </div>

        <!-- 全文播放控制 -->
        <button class="action-btn" id="fullPlayBtn">▶ 播放全文</button>
        <button class="action-btn secondary" id="fullPauseBtn" disabled>⏸ 暂停</button>

        <!-- 全文录音控制 -->
        <button class="action-btn secondary" id="fullRecordBtn">🎙 录音全文</button>
        <button class="action-btn danger" id="fullStopRecordBtn" style="display:none;">⏹ 停止录音</button>
        <button class="action-btn outline" id="fullPlaybackBtn" disabled>🔁 回放全文</button>

        <!-- 训练控制 -->
        <button class="action-btn" id="mainActionBtn">▶ 开始训练</button>
        <button class="action-btn danger" id="stopRecordingBtn" style="display:none;">⏹ 停止录音</button>

        <span class="progress-text" id="progressText">0 / 0</span>
    </div>

    <!-- 句子列表 -->
    <div id="sentencesContainer" class="sentences-list"></div>

    <!-- 报告 -->
    <div class="report-area" id="reportArea">
        <h3>📊 训练报告</h3>
        <div class="report-stats" id="reportStats"></div>
        <div style="margin-top:12px; background:#f5f0eb; padding:12px 16px; border-radius:12px;" id="worstSentences"></div>
        <div style="margin-top:12px; background:#f5f0eb; padding:12px 16px; border-radius:12px;" id="errorWordsSummary"></div>
        <div class="report-actions">
            <button class="action-btn" id="retrainBtn">🔄 重新训练</button>
            <button class="action-btn secondary" id="exportReportBtn" style="background:#d4a373; box-shadow:0 4px 14px rgba(212,163,115,0.3);">📄 导出报告</button>
        </div>
    </div>

    <!-- 历史 -->
    <div class="history-area" id="historyArea">
        <h4>📋 最近训练记录</h4>
        <div id="historyList"></div>
    </div>
</div>

<script>
(function(){
    "use strict";

    // ================================================================
    // 1. API 配置
    // ================================================================
    const PROXY_URL = 'https://azure-tts-proxy.vercel.app/api/tts';
    const PROXY_SECRET = 'mysecret2026';

    // ================================================================
    // 2. 工具函数
    // ================================================================
    function base64ToBlob(base64, mimeType) {
        const byteCharacters = atob(base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        return new Blob([byteArray], { type: mimeType });
    }

    // ================================================================
    // 3. 范文数据（完整版 41 篇）
    // ================================================================
    const passages = [
        // ---- 原有范文：投诉处理 ----
        {
            title: "How to Handle Customer Complaints Effectively",
            sentences: [
                { en: "When dealing with customer complaints, the first step is to listen actively.", zh: "在處理客戶投訴時，第一步是積極傾聽。" },
                { en: "You should let the customer express their frustration without interruption.", zh: "你應該讓客戶完整表達他們的不滿，不要打斷。" },
                { en: "After understanding the issue, apologize sincerely and take responsibility.", zh: "在了解問題之後，真誠地道歉並承擔責任。" },
                { en: "Then, propose a clear solution and explain the steps you will take.", zh: "然後，提出明確的解決方案，並說明你將採取的步驟。" },
                { en: "Finally, follow up with the customer to ensure their satisfaction.", zh: "最後，跟進客戶以確保他們滿意。" },
                { en: "This approach not only resolves the problem but also builds trust.", zh: "這種方法不僅能解決問題，還能建立信任。" },
                { en: "A well-handled complaint can turn a dissatisfied customer into a loyal one.", zh: "處理得當的投訴可以將不滿意的客戶轉變為忠實的客戶。" }
            ]
        },
        // ===== Part 1 — Presentation =====
        {
            title: "範文 1：溫暖的回憶（官方題目）",
            sentences: [
                { en: "I'd like to talk about a warm memory from when my son was little.", zh: "我想谈谈我儿子小时候的一个温暖回忆。" },
                { en: "He was so adorable – he had a chubby little body and he always gave me the sweetest smile.", zh: "他太可爱了——胖乎乎的小身体，总是给我最甜美的笑容。" },
                { en: "First of all, there was one particular afternoon that I still remember vividly.", zh: "首先，有一个特别的下午我至今记忆犹新。" },
                { en: "He was playing with our cat in the living room.", zh: "他正在客厅里和我们的猫玩耍。" },
                { en: "They were chasing each other around, playfully hitting and rolling on the floor.", zh: "它们互相追逐，嬉戏打闹，在地板上滚来滚去。" },
                { en: "It was so funny to watch them together.", zh: "看着它们在一起真是太有趣了。" },
                { en: "In addition to that, the most hilarious part was when they both tried to squeeze into the washing machine afterwards.", zh: "除此之外，最搞笑的是之后它们俩都想挤进洗衣机里。" },
                { en: "They were so small and curious, and they seemed to think it was a great hiding place!", zh: "它们那么小又好奇，似乎觉得那是个很棒的藏身之处！" },
                { en: "I just sat there watching them, feeling so happy and content.", zh: "我就坐在那里看着它们，感到非常幸福和满足。" },
                { en: "Finally, looking back at that moment now, I still feel really warm inside.", zh: "最后，现在回想那一刻，我内心仍然感到非常温暖。" },
                { en: "This is mainly because everyone I loved was right there with me – my son, my cat, all together in that sunny afternoon.", zh: "这主要是因为所有我爱的人都在我身边——我的儿子、我的猫，都在那个阳光明媚的下午聚在一起。" },
                { en: "It was a moment of pure happiness, and I will always treasure it.", zh: "那是一个纯粹快乐的时刻，我会永远珍惜它。" }
            ]
        },
        {
            title: "範文 2：慶祝活動（官方題目）",
            sentences: [
                { en: "I'd like to talk about a celebration that I really enjoyed – it was Christmas.", zh: "我想谈谈一个我真的很喜欢的庆祝活动——那是圣诞节。" },
                { en: "That year, I went to Hong Kong with my husband to celebrate the holiday.", zh: "那一年，我和丈夫去了香港庆祝节日。" },
                { en: "First of all, the Christmas atmosphere on the streets was absolutely magical.", zh: "首先，街上的圣诞气氛绝对神奇。" },
                { en: "Everywhere we looked, there were beautiful lights, decorations, and Christmas trees.", zh: "我们目之所及，到处都是美丽的灯光、装饰和圣诞树。" },
                { en: "It felt so festive and joyful.", zh: "感觉如此喜庆和快乐。" },
                { en: "In addition to that, we did so many wonderful things together.", zh: "除此之外，我们还一起做了很多美好的事情。" },
                { en: "We took lots of photos by the seaside, walked around the shopping malls, and in the evening, we had a romantic dinner with a beautiful view.", zh: "我们在海边拍了很多照片，逛了商场，晚上还享用了有美景相伴的浪漫晚餐。" },
                { en: "After that, we watched the stunning night view of Victoria Harbour – it was breathtaking.", zh: "之后，我们欣赏了维多利亚港令人惊叹的夜景——美得令人窒息。" },
                { en: "Finally, looking back at that celebration now, I still feel incredibly happy and sweet inside.", zh: "最后，现在回想那个庆祝活动，我内心仍然感到无比幸福和甜蜜。" },
                { en: "This is mainly because it was a special time for just the two of us, away from our daily routines.", zh: "这主要是因为那是只属于我们两个人的特殊时光，远离了日常琐事。" },
                { en: "It was a truly memorable and romantic experience that I will always cherish.", zh: "那是一次真正难忘而浪漫的经历，我会永远珍惜。" }
            ]
        },
        {
            title: "範文 3：成功的團隊專案（官方題目）",
            sentences: [
                { en: "I'd like to talk about a successful team work experience that I still remember very well.", zh: "我想谈谈一次我至今记忆犹新的成功的团队合作经历。" },

    // ================================================================
    // 4. 状态管理
    // ================================================================
    const STORAGE_KEY = 'shadowReadData_v2';
    let currentPassageIndex = 0;
    let sentenceStates = [];
    let trainingActive = false;
    let currentSentenceIndex = 0;
    let ttsUtterance = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recognition = null;
    let isRecording = false;
    let recordingTimer = null;
    let waveformAnimId = null;
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let canvasCtx = null;
    let canvasEl = null;
    let isTrainingComplete = false;
    let cachedStream = null;
    let currentRecordingBlob = null;

    // ---- 全文播放状态 ----
    let fullPlayActive = false;
    let fullPlayPaused = false;
    let fullPlayCurrentIndex = 0;
    let fullPlayTimeoutId = null;
    let fullPlayCancelled = false;
    let fullPlaySpeed = 0.8;

    // ---- 全文录音状态 ----
    let fullRecorder = null;
    let fullAudioChunks = [];
    let isFullRecording = false;
    let fullRecordBlob = null;

    // DOM refs
    const passageSelect = document.getElementById('passageSelect');
    const progressText = document.getElementById('progressText');
    const mainBtn = document.getElementById('mainActionBtn');
    const stopBtn = document.getElementById('stopRecordingBtn');
    const sentencesContainer = document.getElementById('sentencesContainer');
    const reportArea = document.getElementById('reportArea');
    const reportStats = document.getElementById('reportStats');
    const worstSentencesEl = document.getElementById('worstSentences');
    const errorWordsSummaryEl = document.getElementById('errorWordsSummary');
    const historyList = document.getElementById('historyList');
    const browserWarning = document.getElementById('browserWarning');
    const versionBadge = document.getElementById('versionBadge');

    // 全文控制
    const fullPlayBtn = document.getElementById('fullPlayBtn');
    const fullPauseBtn = document.getElementById('fullPauseBtn');
    const fullRecordBtn = document.getElementById('fullRecordBtn');
    const fullStopRecordBtn = document.getElementById('fullStopRecordBtn');
    const fullPlaybackBtn = document.getElementById('fullPlaybackBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasRecognition = !!SR;

    // ================================================================
    // 5. 初始化
    // ================================================================
    function init() {
        if (!hasRecognition) {
            browserWarning.classList.add('show');
        }
        populatePassageSelect();
        loadFromStorageOrReset();
        bindEvents();
        renderSentences();
        updateProgress();
        updateHistory();
        checkUnfinished();
        initSpeedControls();
        updateFullPlaybackBtn();
    }

    function populatePassageSelect() {
        passageSelect.innerHTML = '';
        passages.forEach((p, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = p.title || `范文 ${idx+1}`;
            passageSelect.appendChild(opt);
        });
        passageSelect.value = currentPassageIndex;
    }

    function loadFromStorageOrReset() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.passageIndex !== undefined && data.sentenceStates) {
                    currentPassageIndex = data.passageIndex;
                    sentenceStates = data.sentenceStates;
                    const sentences = passages[currentPassageIndex]?.sentences || [];
                    while (sentenceStates.length < sentences.length) {
                        sentenceStates.push({ status: 'idle', transcript: '', accuracy: 0, wordResults: [], audioBlob: null, enVisible: true, zhVisible: false });
                    }
                    const allDone = sentenceStates.every(s => s.status === 'done');
                    if (allDone && sentenceStates.length > 0) {
                        isTrainingComplete = true;
                        showReport();
                    }
                    return;
                }
            } catch(e) {}
        }
        resetAllState();
    }

    function resetAllState() {
        const sentences = passages[currentPassageIndex]?.sentences || [];
        sentenceStates = sentences.map(() => ({
            status: 'idle',
            transcript: '',
            accuracy: 0,
            wordResults: [],
            audioBlob: null,
            enVisible: true,
            zhVisible: false
        }));
        isTrainingComplete = false;
        trainingActive = false;
        currentSentenceIndex = 0;
        reportArea.classList.remove('show');
        localStorage.removeItem(STORAGE_KEY);
        currentRecordingBlob = null;
    }

    function saveState() {
        const data = {
            passageIndex: currentPassageIndex,
            sentenceStates: sentenceStates
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function checkUnfinished() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.sentenceStates && data.sentenceStates.some(s => s.status === 'idle' || s.status === 'tts' || s.status === 'recording')) {
                    if (confirm('检测到未完成的训练，是否继续？')) {
                        renderSentences();
                        updateProgress();
                        return;
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                        resetAllState();
                        renderSentences();
                        updateProgress();
                    }
                }
            } catch(e) {}
        }
    }

    // ================================================================
    // 6. 语速控制
    // ================================================================
    function initSpeedControls() {
        speedSlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            speedDisplay.textContent = val.toFixed(2);
            fullPlaySpeed = val;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active-speed'));
            const presets = [0.5, 0.7, 0.8, 1.0, 1.2, 1.5];
            let closest = null;
            let closestDiff = Infinity;
            presets.forEach(p => {
                const diff = Math.abs(p - val);
                if (diff < closestDiff) { closestDiff = diff; closest = p; }
            });
            if (closestDiff < 0.02) {
                document.querySelector(`.speed-btn[data-speed="${closest}"]`)?.classList.add('active-speed');
            }
        });

        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const val = parseFloat(this.dataset.speed);
                speedSlider.value = val;
                speedDisplay.textContent = val.toFixed(2);
                fullPlaySpeed = val;
                document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active-speed'));
                this.classList.add('active-speed');
            });
        });
    }

    function getCurrentSpeed() {
        return fullPlaySpeed;
    }

    // ================================================================
    // 7. 全文播放
    // ================================================================
    function getEnglishSentences() {
        const sentences = passages[currentPassageIndex]?.sentences || [];
        return sentences.filter(s => s.en && s.en.trim().length > 0);
    }

    function clearFullPlayHighlights() {
        document.querySelectorAll('.sentence-card.full-play-highlight').forEach(el => {
            el.classList.remove('full-play-highlight');
        });
    }

    function highlightFullPlaySentence(index) {
        clearFullPlayHighlights();
        const cards = document.querySelectorAll('.sentence-card');
        if (cards[index]) {
            cards[index].classList.add('full-play-highlight');
            cards[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function stopFullPlay() {
        fullPlayCancelled = true;
        fullPlayActive = false;
        fullPlayPaused = false;
        if (fullPlayTimeoutId) {
            clearTimeout(fullPlayTimeoutId);
            fullPlayTimeoutId = null;
        }
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
        }
        clearFullPlayHighlights();
        updateFullPlayButtons();
    }

    function pauseFullPlay() {
        if (fullPlayActive && !fullPlayPaused) {
            fullPlayPaused = true;
            fullPlayActive = false;
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            if (fullPlayTimeoutId) {
                clearTimeout(fullPlayTimeoutId);
                fullPlayTimeoutId = null;
            }
            updateFullPlayButtons();
        }
    }

    function resumeFullPlay() {
        if (fullPlayPaused) {
            fullPlayPaused = false;
            fullPlayActive = true;
            fullPlayCancelled = false;
            updateFullPlayButtons();
            speakFullSentence(fullPlayCurrentIndex);
        }
    }

    function startFullPlay() {
        if (fullPlayActive && !fullPlayPaused) return;
        if (fullPlayPaused) {
            resumeFullPlay();
            return;
        }
        const sentences = getEnglishSentences();
        if (sentences.length === 0) {
            alert('当前范文没有英文句子');
            return;
        }
        stopFullPlay();
        fullPlayActive = true;
        fullPlayPaused = false;
        fullPlayCancelled = false;
        fullPlayCurrentIndex = 0;
        updateFullPlayButtons();
        speakFullSentence(0);
    }

    function speakFullSentence(index) {
        if (fullPlayCancelled || !fullPlayActive) {
            fullPlayActive = false;
            updateFullPlayButtons();
            return;
        }
        const sentences = getEnglishSentences();
        if (index >= sentences.length) {
            fullPlayActive = false;
            fullPlayPaused = false;
            clearFullPlayHighlights();
            updateFullPlayButtons();
            showToast('✅ 全文播放完成！');
            return;
        }
        fullPlayCurrentIndex = index;
        const text = sentences[index].en;
        highlightFullPlaySentence(index);

        // 使用 Azure TTS 播放
        const voiceSelect = document.getElementById('voiceSelect');
        const voiceName = voiceSelect ? voiceSelect.value : 'en-GB-SoniaNeural';
        const rate = getCurrentSpeed();

        fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-proxy-secret': PROXY_SECRET },
            body: JSON.stringify({ action: 'tts', text: text, voice: voiceName, rate: rate })
        })
        .then(res => {
            if (!res.ok) throw new Error('API 请求失败');
            return res.json();
        })
        .then(data => {
            if (!data.success || !data.audio) throw new Error('音频数据错误');
            const audioBlob = base64ToBlob(data.audio, 'audio/mp3');
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            audio.play();
            audio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                if (fullPlayActive && !fullPlayPaused && !fullPlayCancelled) {
                    fullPlayTimeoutId = setTimeout(() => {
                        speakFullSentence(index + 1);
                    }, 400);
                }
            };
            audio.onerror = () => {
                URL.revokeObjectURL(audioUrl);
                // 降级到浏览器 TTS
                fallbackFullPlayTTS(text, index);
            };
        })
        .catch(err => {
            console.warn('Azure TTS 失败，降级:', err);
            fallbackFullPlayTTS(text, index);
        });
    }

    function fallbackFullPlayTTS(text, index) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = getCurrentSpeed();
        utterance.pitch = 1.0;
        utterance.onend = () => {
            if (fullPlayActive && !fullPlayPaused && !fullPlayCancelled) {
                fullPlayTimeoutId = setTimeout(() => {
                    speakFullSentence(index + 1);
                }, 400);
            }
        };
        utterance.onerror = () => {
            if (fullPlayActive && !fullPlayPaused && !fullPlayCancelled) {
                fullPlayTimeoutId = setTimeout(() => {
                    speakFullSentence(index + 1);
                }, 400);
            }
        };
        window.speechSynthesis.speak(utterance);
    }

    function updateFullPlayButtons() {
        if (fullPlayActive && !fullPlayPaused) {
            fullPlayBtn.textContent = '🔊 播放中...';
            fullPlayBtn.disabled = true;
            fullPauseBtn.textContent = '⏸ 暂停';
            fullPauseBtn.disabled = false;
        } else if (fullPlayPaused) {
            fullPlayBtn.textContent = '▶ 继续';
            fullPlayBtn.disabled = false;
            fullPauseBtn.textContent = '⏸ 暂停';
            fullPauseBtn.disabled = true;
        } else {
            fullPlayBtn.textContent = '▶ 播放全文';
            fullPlayBtn.disabled = false;
            fullPauseBtn.textContent = '⏸ 暂停';
            fullPauseBtn.disabled = true;
        }
    }

    // ================================================================
    // 8. 全文录音
    // ================================================================
    function startFullRecording() {
        if (!navigator.mediaDevices) {
            alert('浏览器不支持麦克风');
            return;
        }
        if (isFullRecording) return;

        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                isFullRecording = true;
                fullAudioChunks = [];
                fullRecordBlob = null;
                fullRecorder = new MediaRecorder(stream);
                fullRecorder.ondataavailable = e => {
                    if (e.data.size > 0) fullAudioChunks.push(e.data);
                };
                fullRecorder.onstop = () => {
                    const blob = new Blob(fullAudioChunks, { type: 'audio/webm' });
                    if (blob.size > 2000) {
                        fullRecordBlob = blob;
                        const key = `full_recording_${currentPassageIndex}`;
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            try {
                                localStorage.setItem(key, e.target.result.split(',')[1]);
                                localStorage.setItem(key + '_type', 'audio/webm');
                                showToast('✅ 全文录音已保存！');
                                updateFullPlaybackBtn();
                            } catch(err) {
                                showToast('⚠️ 录音保存失败');
                            }
                        };
                        reader.readAsDataURL(blob);
                    } else {
                        showToast('⚠️ 录音太短，请重新录制');
                    }
                    isFullRecording = false;
                    fullRecordBtn.textContent = '🎙 录音全文';
                    fullRecordBtn.style.display = 'inline-block';
                    fullStopRecordBtn.style.display = 'none';
                    fullRecordBtn.classList.remove('recording-pulse');
                };
                fullRecorder.start();
                fullRecordBtn.textContent = '🔴 录音中...';
                fullRecordBtn.style.display = 'none';
                fullStopRecordBtn.style.display = 'inline-block';
                fullStopRecordBtn.classList.add('recording-pulse');
                showToast('🎙 全文录音中... 点击"停止录音"结束');
            })
            .catch(err => {
                alert('麦克风授权被拒绝: ' + err.message);
            });
    }

    function stopFullRecording() {
        if (fullRecorder && fullRecorder.state === 'recording') {
            fullRecorder.stop();
            fullRecorder = null;
        }
        if (isFullRecording) {
            isFullRecording = false;
        }
        fullRecordBtn.textContent = '🎙 录音全文';
        fullRecordBtn.style.display = 'inline-block';
        fullStopRecordBtn.style.display = 'none';
        fullStopRecordBtn.classList.remove('recording-pulse');
    }

    function playFullRecording() {
        const key = `full_recording_${currentPassageIndex}`;
        const data = localStorage.getItem(key);
        if (!data) {
            showToast('⚠️ 没有全文录音');
            return;
        }
        try {
            const mimeType = localStorage.getItem(key + '_type') || 'audio/webm';
            const blob = base64ToBlob(data, mimeType);
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
            audio.onended = () => URL.revokeObjectURL(url);
            showToast('🔊 播放全文录音...');
        } catch(e) {
            showToast('⚠️ 播放失败');
        }
    }

    function updateFullPlaybackBtn() {
        const key = `full_recording_${currentPassageIndex}`;
        const data = localStorage.getItem(key);
        if (data) {
            fullPlaybackBtn.disabled = false;
            fullPlaybackBtn.textContent = '🔁 回放全文';
        } else {
            fullPlaybackBtn.disabled = true;
            fullPlaybackBtn.textContent = '🔁 回放全文';
        }
    }

    // ================================================================
    // 9. 渲染句子
    // ================================================================
    function renderSentences() {
        const sentences = passages[currentPassageIndex]?.sentences || [];
        if (sentences.length === 0) {
            sentencesContainer.innerHTML = '<div style="color:#8a7a6a; padding:20px; text-align:center;">暂无句子</div>';
            return;
        }
        while (sentenceStates.length < sentences.length) {
            sentenceStates.push({ status: 'idle', transcript: '', accuracy: 0, wordResults: [], audioBlob: null, enVisible: true, zhVisible: false });
        }

        let html = '';
        sentences.forEach((s, idx) => {
            const state = sentenceStates[idx] || { status: 'idle', transcript: '', accuracy: 0, wordResults: [], audioBlob: null, enVisible: true, zhVisible: false };
            let statusClass = '';
            let statusIcon = '⏳';
            let accuracyHtml = '';
            let comparisonHtml = '';
            let waveformHtml = '';
            let statusText = '待训练';
            let manualInputHtml = '';

            if (state.status === 'tts') {
                statusClass = 'active-tts';
                statusIcon = '🔊';
                statusText = '朗读中...';
            } else if (state.status === 'recording') {
                statusClass = 'recording';
                statusIcon = '🎙️';
                statusText = '录音中...';
            } else if (state.status === 'done') {
                statusClass = 'completed';
                statusIcon = '✅';
                statusText = '已完成';
                const acc = state.accuracy || 0;
                accuracyHtml = `<span class="accuracy-badge">${acc}%</span>`;
                if (state.wordResults && state.wordResults.length) {
                    const wordsHtml = state.wordResults.map(w => {
                        if (w.match) return `<span class="word-match">${w.word}</span>`;
                        else return `<span class="word-mismatch" data-correct="${w.correct || ''}">${w.word}</span>`;
                    }).join(' ');
                    comparisonHtml = `<div class="comparison-result show">${wordsHtml}</div>`;
                } else if (state.transcript) {
                    comparisonHtml = `<div class="comparison-result show" style="color:#6a5a4a;">识别: ${state.transcript}</div>`;
                }
            } else {
                if (state.audioBlob && !state.transcript) {
                    manualInputHtml = `
                        <div class="manual-input-area show">
                            <input type="text" id="manualInput_${idx}" placeholder="输入您刚才说的内容..." />
                            <button class="mini-btn" data-action="manualScore" data-idx="${idx}">确认评分</button>
                        </div>
                    `;
                }
            }

            if (state.status === 'recording') {
                waveformHtml = `
                    <div class="waveform-wrapper active" id="waveform_${idx}">
                        <canvas id="waveCanvas_${idx}"></canvas>
                    </div>
                `;
            }

            const enHidden = state.enVisible === false ? 'hidden' : '';
            const zhHidden = state.zhVisible === false ? 'hidden' : '';

            html += `
                <div class="sentence-card ${statusClass}" data-index="${idx}">
                    <div class="sentence-text ${enHidden}" data-idx="${idx}" data-type="en">${s.en}</div>
                    <div class="translation-area ${zhHidden}" data-idx="${idx}" data-type="zh">
                        <span class="zh-text">${s.zh}</span>
                    </div>
                    <div class="card-status">
                        <span>${statusIcon} ${statusText}</span>
                        ${accuracyHtml}
                    </div>
                    ${waveformHtml}
                    ${comparisonHtml}
                    ${manualInputHtml}
                    <div class="sentence-actions">
                        <button class="mini-btn primary" data-action="play" data-idx="${idx}">▶ 播放</button>
                        <button class="mini-btn ${state.status === 'recording' ? 'active' : ''}" data-action="record" data-idx="${idx}">${state.status === 'recording' ? '⏹ 停止' : '🎙 录音'}</button>
                        <button class="mini-btn" data-action="playback" data-idx="${idx}" ${state.audioBlob ? '' : 'disabled'}>🔁 回放</button>
                        <button class="mini-btn success" data-action="score" data-idx="${idx}" ${state.audioBlob ? '' : 'disabled'}>📊 评分</button>
                    </div>
                </div>
            `;
        });

        sentencesContainer.innerHTML = html;
        bindSentenceActions();

        const recIdx = sentenceStates.findIndex(s => s.status === 'recording');
        if (recIdx !== -1) {
            const canvas = document.getElementById(`waveCanvas_${recIdx}`);
            if (canvas) {
                setupWaveform(canvas);
            }
        }
        updateFullPlaybackBtn();
    }

    // ================================================================
    // 10. 事件绑定
    // ================================================================
    function bindSentenceActions() {
        document.querySelectorAll('.sentence-actions').forEach(group => {
            group.querySelectorAll('.mini-btn').forEach(btn => {
                btn.removeEventListener('click', handleAction);
                btn.addEventListener('click', handleAction);
            });
        });

        document.querySelectorAll('[data-action="manualScore"]').forEach(btn => {
            btn.removeEventListener('click', handleManualScore);
            btn.addEventListener('click', handleManualScore);
        });

        document.querySelectorAll('.sentence-text').forEach(el => {
            el.removeEventListener('click', toggleEnVisibility);
            el.addEventListener('click', toggleEnVisibility);
        });
        document.querySelectorAll('.translation-area').forEach(el => {
            el.removeEventListener('click', toggleZhVisibility);
            el.addEventListener('click', toggleZhVisibility);
        });
    }

    function toggleEnVisibility(e) {
        const el = e.currentTarget;
        const idx = parseInt(el.dataset.idx);
        const state = sentenceStates[idx];
        if (!state) return;
        state.enVisible = !state.enVisible;
        saveState();
        renderSentences();
    }

    function toggleZhVisibility(e) {
        const el = e.currentTarget;
        const idx = parseInt(el.dataset.idx);
        const state = sentenceStates[idx];
        if (!state) return;
        state.zhVisible = !state.zhVisible;
        saveState();
        renderSentences();
    }

    function handleAction(e) {
        const btn = e.currentTarget;
        const action = btn.dataset.action;
        const idx = parseInt(btn.dataset.idx);
        if (isNaN(idx)) return;

        switch(action) {
            case 'play': handlePlay(idx); break;
            case 'record': handleRecord(idx); break;
            case 'playback': handlePlayback(idx); break;
            case 'score': handleScore(idx); break;
        }
    }

    // ================================================================
    // 11. 核心功能函数 - 单句播放（Azure TTS）
    // ================================================================
    async function handlePlay(idx) {
        const sentences = passages[currentPassageIndex]?.sentences || [];
        if (idx >= sentences.length) return;

        const text = sentences[idx].en;
        const voiceSelect = document.getElementById('voiceSelect');
        const voiceName = voiceSelect ? voiceSelect.value : 'en-GB-SoniaNeural';
        const rate = getCurrentSpeed();

        try {
            const btn = document.querySelector(`.sentence-actions button[data-action="play"][data-idx="${idx}"]`);
            if (btn) btn.textContent = '⏳ 加载中...';

            const response = await fetch(PROXY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-proxy-secret': PROXY_SECRET
                },
                body: JSON.stringify({
                    action: 'tts',
                    text: text,
                    voice: voiceName,
                    rate: rate
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || `API 请求失败: ${response.status}`);
            }

            const data = await response.json();
            if (!data.success || !data.audio) {
                throw new Error(data.error || 'Azure 回传数据错误');
            }

            const audioBlob = base64ToBlob(data.audio, 'audio/mp3');
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            audio.play();
            audio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                if (btn) btn.textContent = '▶ 播放';
            };
            audio.onerror = () => {
                console.warn('音频播放失败，降级到浏览器 TTS');
                fallbackToBrowserTTS(text, idx);
            };

        } catch (error) {
            console.warn('Azure TTS 调用失败，降级到浏览器 TTS:', error.message);
            fallbackToBrowserTTS(text, idx);
        }
    }

    function fallbackToBrowserTTS(text, idx) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = getCurrentSpeed();
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);

        const btn = document.querySelector(`.sentence-actions button[data-action="play"][data-idx="${idx}"]`);
        if (btn) {
            setTimeout(() => { btn.textContent = '▶ 播放'; }, 500);
        }
    }

    // ================================================================
    // 12. 录音、回放、评分等功能
    // ================================================================
    function handleRecord(idx) {
        const state = sentenceStates[idx];
        if (!state) return;

        if (state.status === 'recording') {
            stopRecording(idx);
            return;
        }

        startRecordingSingle(idx);
    }

    function startRecordingSingle(idx) {
        if (!navigator.mediaDevices) {
            alert('浏览器不支持麦克风');
            return;
        }

        const state = sentenceStates[idx];
        state.status = 'recording';
        state.transcript = '';
        saveState();
        renderSentences();
        isRecording = true;

        const startStream = (stream) => {
            cachedStream = stream;
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            currentRecordingBlob = null;
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                currentRecordingBlob = blob;
                state.audioBlob = blob;
                saveState();
                renderSentences();
            };
            mediaRecorder.start();

            if (hasRecognition) {
                try {
                    recognition = new SR();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';
                    recognition.maxAlternatives = 1;
                    recognition.onresult = (event) => {
                        let final = '';
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            if (event.results[i].isFinal) {
                                final += event.results[i][0].transcript;
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        if (final) {
                            state.transcript = final.trim();
                            saveState();
                        } else if (interim) {
                            state.transcript = interim.trim();
                            saveState();
                        }
                    };
                    recognition.onerror = (e) => {
                        console.warn('语音识别错误:', e.error);
                    };
                    recognition.start();
                } catch(e) {
                    console.warn('语音识别启动失败:', e);
                }
            }

            const canvas = document.getElementById(`waveCanvas_${idx}`);
            if (canvas) setupWaveform(canvas);

            clearTimeout(recordingTimer);
            recordingTimer = setTimeout(() => {
                if (state.status === 'recording') stopRecording(idx);
            }, 15000);
        };

        if (cachedStream) {
            startStream(cachedStream);
        } else {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    startStream(stream);
                })
                .catch(err => {
                    alert('麦克风授权被拒绝，请在浏览器中允许麦克风权限后重试。');
                    state.status = 'idle';
                    saveState();
                    renderSentences();
                });
        }
    }

    function stopRecording(idx) {
        const state = sentenceStates[idx];
        if (!state || state.status !== 'recording') return;
        isRecording = false;
        clearTimeout(recordingTimer);

        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
        if (recognition) {
            try {
                recognition.stop();
            } catch(e) {}
            recognition = null;
        }
        if (waveformAnimId) {
            cancelAnimationFrame(waveformAnimId);
            waveformAnimId = null;
        }

        setTimeout(() => {
            state.status = 'idle';
            saveState();
            renderSentences();
        }, 300);

        if (audioContext && audioContext.state === 'running') {
            audioContext.close().catch(()=>{});
            audioContext = null;
            analyser = null;
        }
    }

    function handlePlayback(idx) {
        const state = sentenceStates[idx];
        if (!state || !state.audioBlob) return;
        const url = URL.createObjectURL(state.audioBlob);
        const audio = new Audio(url);
        audio.play();
        audio.onended = () => URL.revokeObjectURL(url);
    }

    function handleScore(idx) {
        const state = sentenceStates[idx];
        if (!state || !state.audioBlob) {
            alert('请先录音再评分');
            return;
        }

        if (state.transcript && state.transcript.trim().length > 0) {
            performComparison(idx);
            return;
        }

        const inputArea = document.querySelector(`.sentence-card[data-index="${idx}"] .manual-input-area`);
        if (inputArea) {
            inputArea.classList.add('show');
            const input = inputArea.querySelector('input');
            if (input) input.focus();
        } else {
            renderSentences();
            const newInput = document.getElementById(`manualInput_${idx}`);
            if (newInput) newInput.focus();
        }
    }

    function handleManualScore(e) {
        const btn = e.currentTarget;
        const idx = parseInt(btn.dataset.idx);
        const input = document.getElementById(`manualInput_${idx}`);
        if (!input) return;
        const text = input.value.trim();
        if (!text) {
            alert('请输入您刚才说的内容');
            return;
        }
        const state = sentenceStates[idx];
        state.transcript = text;
        saveState();
        performComparison(idx);
    }

    function performComparison(idx) {
        const state = sentenceStates[idx];
        const original = passages[currentPassageIndex]?.sentences[idx]?.en || '';
        const transcript = state.transcript || '';
        if (!transcript.trim()) {
            alert('没有可对比的文本，请录音或手动输入');
            return;
        }
        const result = compareWords(original, transcript);
        state.wordResults = result.results;
        state.accuracy = result.accuracy;
        state.status = 'done';
        saveState();
        renderSentences();
        updateProgress();

        const allDone = sentenceStates.every(s => s.status === 'done');
        if (allDone && sentenceStates.length > 0) {
            isTrainingComplete = true;
            showReport();
            updateHistory();
        }
    }

    function compareWords(original, transcript) {
        const origWords = original.toLowerCase().replace(/[^a-z' ]/g, '').split(/\s+/).filter(w => w);
        const transWords = transcript.toLowerCase().replace(/[^a-z' ]/g, '').split(/\s+/).filter(w => w);
        const results = [];
        let matchCount = 0;
        for (let i = 0; i < origWords.length; i++) {
            const w = origWords[i];
            const match = (i < transWords.length && transWords[i] === w);
            if (match) matchCount++;
            results.push({
                word: w,
                match: match,
                correct: w
            });
        }
        const accuracy = origWords.length > 0 ? Math.round((matchCount / origWords.length) * 100) : 0;
        return { results, accuracy };
    }

    // ================================================================
    // 13. 全局训练流程（保留原有功能）
    // ================================================================
    function startTraining() {
        if (trainingActive) return;
        const sentences = passages[currentPassageIndex]?.sentences || [];
        if (sentences.length === 0) return;

        if (sentenceStates.every(s => s.status === 'done')) {
            alert('已完成所有句子，可查看报告或重新训练。');
            return;
        }

        const idx = sentenceStates.findIndex(s => s.status !== 'done');
        if (idx === -1) {
            showReport();
            return;
        }
        currentSentenceIndex = idx;
        trainingActive = true;
        mainBtn.disabled = true;
        mainBtn.textContent = '⏳ 训练中...';
        startGlobalTTS(idx);
    }

    function startGlobalTTS(index) {
        const sentences = passages[currentPassageIndex]?.sentences || [];
        if (index >= sentences.length) {
            finishTraining();
            return;
        }
        sentenceStates[index].status = 'tts';
        saveState();
        renderSentences();
        updateProgress();

        const text = sentences[index].en;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        ttsUtterance = utterance;

        utterance.onend = () => {
            startGlobalRecording(index);
        };
        utterance.onerror = () => {
            startGlobalRecording(index);
        };
        window.speechSynthesis.speak(utterance);
    }

    function startGlobalRecording(index) {
        const state = sentenceStates[index];
        state.status = 'recording';
        state.transcript = '';
        saveState();
        renderSentences();
        updateProgress();
        isRecording = true;
        stopBtn.style.display = 'inline-block';
        mainBtn.disabled = true;

        const startStream = (stream) => {
            cachedStream = stream;
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            currentRecordingBlob = null;
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                currentRecordingBlob = blob;
                state.audioBlob = blob;
                saveState();
            };
            mediaRecorder.start();

            if (hasRecognition) {
                try {
                    recognition = new SR();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';
                    recognition.onresult = (event) => {
                        let final = '';
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            if (event.results[i].isFinal) {
                                final += event.results[i][0].transcript;
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        if (final) {
                            state.transcript = final.trim();
                            saveState();
                        } else if (interim) {
                            state.transcript = interim.trim();
                            saveState();
                        }
                    };
                    recognition.onerror = () => {};
                    recognition.start();
                } catch(e) {}
            }

            const canvas = document.getElementById(`waveCanvas_${index}`);
            if (canvas) setupWaveform(canvas);

            clearTimeout(recordingTimer);
            recordingTimer = setTimeout(() => {
                if (state.status === 'recording') stopGlobalRecording(index);
            }, 15000);
        };

        if (cachedStream) {
            startStream(cachedStream);
        } else {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    startStream(stream);
                })
                .catch(err => {
                    alert('麦克风授权被拒绝，请允许麦克风权限后重试。');
                    resetTraining();
                });
        }
    }

    function stopGlobalRecording(index) {
        const state = sentenceStates[index];
        if (!state || state.status !== 'recording') return;
        isRecording = false;
        clearTimeout(recordingTimer);
        stopBtn.style.display = 'none';

        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
            recognition = null;
        }
        if (waveformAnimId) {
            cancelAnimationFrame(waveformAnimId);
            waveformAnimId = null;
        }

        setTimeout(() => {
            const transcript = state.transcript || '';
            const original = passages[currentPassageIndex]?.sentences[index]?.en || '';
            if (transcript.trim()) {
                const result = compareWords(original, transcript);
                state.wordResults = result.results;
                state.accuracy = result.accuracy;
                state.status = 'done';
            } else {
                state.status = 'idle';
            }
            saveState();
            renderSentences();
            updateProgress();

            if (audioContext && audioContext.state === 'running') {
                audioContext.close().catch(()=>{});
                audioContext = null;
                analyser = null;
            }

            const nextIdx = index + 1;
            const allDone = sentenceStates.every(s => s.status === 'done');
            if (allDone || nextIdx >= sentenceStates.length) {
                finishTraining();
            } else {
                currentSentenceIndex = nextIdx;
                setTimeout(() => {
                    startGlobalTTS(nextIdx);
                }, 600);
            }
        }, 400);
    }

    function finishTraining() {
        trainingActive = false;
        isTrainingComplete = true;
        mainBtn.disabled = false;
        mainBtn.textContent = '✅ 已完成';
        stopBtn.style.display = 'none';
        saveState();
        renderSentences();
        updateProgress();
        showReport();
        updateHistory();
    }

    function resetTraining() {
        trainingActive = false;
        isRecording = false;
        clearTimeout(recordingTimer);
        stopBtn.style.display = 'none';
        if (ttsUtterance) {
            window.speechSynthesis.cancel();
            ttsUtterance = null;
        }
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
        if (waveformAnimId) { cancelAnimationFrame(waveformAnimId); waveformAnimId = null; }
        if (audioContext) { audioContext.close().catch(()=>{}); audioContext = null; analyser = null; }
        mainBtn.disabled = false;
        mainBtn.textContent = '▶ 开始训练';
        const sentences = passages[currentPassageIndex]?.sentences || [];
        sentenceStates = sentences.map(() => ({ status: 'idle', transcript: '', accuracy: 0, wordResults: [], audioBlob: null, enVisible: true, zhVisible: false }));
        isTrainingComplete = false;
        saveState();
        renderSentences();
        updateProgress();
        reportArea.classList.remove('show');
    }

    function updateProgress() {
        const total = sentenceStates.length;
        const done = sentenceStates.filter(s => s.status === 'done').length;
        progressText.textContent = `${done} / ${total}`;
    }

    // ================================================================
    // 14. 波形可视化
    // ================================================================
    function setupWaveform(canvas) {
        canvasEl = canvas;
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        canvasCtx = canvas.getContext('2d');
        drawWaveform();
    }

    function drawWaveform() {
        if (!canvasCtx || !analyser || !dataArray || !canvasEl) return;
        const parent = canvasEl.parentElement;
        const width = parent ? parent.clientWidth : 300;
        const height = 36;
        canvasEl.width = width * 2;
        canvasEl.height = height * 2;
        canvasEl.style.width = width + 'px';
        canvasEl.style.height = height + 'px';
        canvasCtx.scale(2, 2);

        analyser.getByteTimeDomainData(dataArray);
        canvasCtx.fillStyle = '#f5f0eb';
        canvasCtx.fillRect(0, 0, width, height);
        canvasCtx.lineWidth = 2.5;
        canvasCtx.beginPath();
        const sliceWidth = width / dataArray.length;
        let x = 0;
        let maxVal = 0;
        for (let i = 0; i < dataArray.length; i++) {
            const v = dataArray[i] / 128.0 - 1.0;
            const y = v * (height/2) + height/2;
            if (i === 0) canvasCtx.moveTo(x, y);
            else canvasCtx.lineTo(x, y);
            x += sliceWidth;
            if (Math.abs(v) > maxVal) maxVal = Math.abs(v);
        }
        const intensity = Math.min(maxVal * 1.5, 1);
        let color = '#7aa87a';
        if (intensity > 0.5) color = '#d4a373';
        if (intensity > 0.8) color = '#c0392b';
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();

        if (isRecording) {
            waveformAnimId = requestAnimationFrame(drawWaveform);
        }
    }

    // ================================================================
    // 15. 报告 & 历史
    // ================================================================
    function showReport() {
        const states = sentenceStates;
        const done = states.filter(s => s.status === 'done');
        if (done.length === 0) return;
        const accuracies = done.map(s => s.accuracy || 0);
        const totalAcc = Math.round(accuracies.reduce((a,b) => a+b, 0) / accuracies.length);
        reportStats.innerHTML = `
            <div><strong>总准确率</strong> ${totalAcc}%</div>
            <div><strong>已完成</strong> ${done.length}/${states.length}</div>
        `;

        const sorted = done.map((s, i) => ({ idx: i, acc: s.accuracy || 0, text: passages[currentPassageIndex]?.sentences[i]?.en || '' }))
            .sort((a,b) => a.acc - b.acc);
        const worst = sorted.slice(0, 3);
        worstSentencesEl.innerHTML = `<strong>📉 最差3句</strong><br>` + worst.map(w =>
            `<div style="margin:4px 0;">${w.text.substring(0, 60)}${w.text.length > 60 ? '...' : ''} — 准确率 ${w.acc}%</div>`
        ).join('');

        const errorMap = new Map();
        done.forEach(s => {
            (s.wordResults || []).forEach(w => {
                if (!w.match) {
                    errorMap.set(w.word, (errorMap.get(w.word) || 0) + 1);
                }
            });
        });
        const sortedErrors = Array.from(errorMap.entries()).sort((a,b) => b[1] - a[1]);
        errorWordsSummaryEl.innerHTML = `<strong>🔴 错词汇总</strong><br>` +
            (sortedErrors.length ? sortedErrors.map(([word, count]) =>
                `<span style="background:#fdedec; padding:2px 14px; border-radius:20px; margin:4px; display:inline-block; color:#a93226;">${word} (${count}次)</span>`
            ).join('') : '🎉 没有错词！');

        reportArea.classList.add('show');
    }

    function updateHistory() {
        const raw = localStorage.getItem('shadowReadHistory_v2');
        let history = raw ? JSON.parse(raw) : [];
        const recent = history.slice(-5).reverse();
        historyList.innerHTML = recent.length ? recent.map(h =>
            `<div class="history-item"><span>${h.time || ''}</span><span>准确率 ${h.accuracy || 0}% · ${h.title || ''}</span></div>`
        ).join('') : '<div style="color:#8a7a6a;">暂无记录</div>';
    }

    function saveHistory(accuracy) {
        const raw = localStorage.getItem('shadowReadHistory_v2');
        let history = raw ? JSON.parse(raw) : [];
        history.push({
            time: new Date().toLocaleString(),
            accuracy: accuracy,
            title: passages[currentPassageIndex]?.title || '范文'
        });
        if (history.length > 20) history = history.slice(-20);
        localStorage.setItem('shadowReadHistory_v2', JSON.stringify(history));
        updateHistory();
    }

    // ================================================================
    // 16. 全局事件绑定
    // ================================================================
    function bindEvents() {
        // ---- 范文切换 ----
        passageSelect.addEventListener('change', function() {
            if (trainingActive) {
                if (!confirm('切换范文将中断当前训练，确定吗？')) return;
            }
            stopFullPlay();
            stopFullRecording();
            currentPassageIndex = parseInt(this.value);
            resetAllState();
            saveState();
            renderSentences();
            updateProgress();
            reportArea.classList.remove('show');
            mainBtn.textContent = '▶ 开始训练';
            stopBtn.style.display = 'none';
            isTrainingComplete = false;
            updateFullPlaybackBtn();
        });

        // ---- 全文播放 ----
        fullPlayBtn.addEventListener('click', startFullPlay);
        fullPauseBtn.addEventListener('click', pauseFullPlay);

        // ---- 全文录音 ----
        fullRecordBtn.addEventListener('click', startFullRecording);
        fullStopRecordBtn.addEventListener('click', stopFullRecording);
        fullPlaybackBtn.addEventListener('click', playFullRecording);

        // ---- 训练 ----
        mainBtn.addEventListener('click', function() {
            if (isTrainingComplete) {
                if (confirm('已完成训练，是否重新开始？')) {
                    resetAllState();
                    renderSentences();
                    updateProgress();
                    reportArea.classList.remove('show');
                    mainBtn.textContent = '▶ 开始训练';
                    isTrainingComplete = false;
                    startTraining();
                }
                return;
            }
            startTraining();
        });

        stopBtn.addEventListener('click', function() {
            if (isRecording) {
                const idx = sentenceStates.findIndex(s => s.status === 'recording');
                if (idx !== -1) stopGlobalRecording(idx);
            }
        });

        // ---- 报告 ----
        document.getElementById('retrainBtn').addEventListener('click', function() {
            if (confirm('重新训练将清空当前进度，确定吗？')) {
                resetAllState();
                renderSentences();
                updateProgress();
                reportArea.classList.remove('show');
                mainBtn.textContent = '▶ 开始训练';
                isTrainingComplete = false;
                localStorage.removeItem(STORAGE_KEY);
            }
        });

        document.getElementById('exportReportBtn').addEventListener('click', function() {
            const lines = [];
            const states = sentenceStates;
            const sentences = passages[currentPassageIndex]?.sentences || [];
            lines.push(`📋 影子跟读报告 — ${passages[currentPassageIndex]?.title || ''}`);
            lines.push(`时间: ${new Date().toLocaleString()}`);
            states.forEach((s, i) => {
                const text = sentences[i]?.en || '';
                const zh = sentences[i]?.zh || '';
                const acc = s.accuracy || 0;
                lines.push(`\n${i+1}. ${text}`);
                lines.push(`   翻译: ${zh}`);
                lines.push(`   准确率: ${acc}%`);
                if (s.transcript) lines.push(`   识别: ${s.transcript}`);
                if (s.wordResults) {
                    const w = s.wordResults.map(w => w.match ? `✅${w.word}` : `❌${w.word}(${w.correct})`).join(' ');
                    lines.push(`   对比: ${w}`);
                }
            });
            const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `shadow_report_${Date.now()}.txt`;
            a.click();
        });

        // ---- 双击版本号清空数据 ----
        versionBadge.addEventListener('dblclick', function() {
            if (confirm('⚠️ 确定清空所有本地数据？')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem('shadowReadHistory_v2');
                // 清空所有全文录音
                for (let i = 0; i < passages.length; i++) {
                    localStorage.removeItem(`full_recording_${i}`);
                    localStorage.removeItem(`full_recording_${i}_type`);
                }
                resetAllState();
                renderSentences();
                updateProgress();
                reportArea.classList.remove('show');
                mainBtn.textContent = '▶ 开始训练';
                isTrainingComplete = false;
                updateHistory();
                updateFullPlaybackBtn();
                alert('已清空所有数据');
            }
        });
    }

    function stopFullRecording() {
        if (fullRecorder && fullRecorder.state === 'recording') {
            fullRecorder.stop();
            fullRecorder = null;
        }
        isFullRecording = false;
        fullRecordBtn.textContent = '🎙 录音全文';
        fullRecordBtn.style.display = 'inline-block';
        fullStopRecordBtn.style.display = 'none';
        fullStopRecordBtn.classList.remove('recording-pulse');
    }

    function showToast(msg) {
        let toast = document.getElementById('customToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'customToast';
            toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2d2a24;color:#f5f1eb;padding:10px 24px;border-radius:60px;font-size:14px;font-weight:500;opacity:0;transition:opacity 0.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:999;white-space:nowrap;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    // ================================================================
    // 启动
    // ================================================================
    init();

})();
</script>
